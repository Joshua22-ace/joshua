    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #e8f5e9;

        h2 {
            color: #1e88e5;

        /* Styling the container with navigation buttons */
        .container {
            margin-bottom: 20px;
        }

        .button {
            background: linear-gradient(45deg, #1e88e5, #42a5f5);
            color: white;
            padding: 12px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 8px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
            transition: 0.3s;
        }

        .button:hover {
            background: linear-gradient(45deg, #1565c0, #2196f3);
        }

        /* Dropdown menu styles */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 150px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        /* Styling for the reservation form */
        .form-container {
            background: white;
            padding: 20px;
            width: 50%;
            margin: auto;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            text-align: left;
        }

        label {
            font-size: 16px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .submit-button {
            background: linear-gradient(45deg, #4caf50, #2e7d32);
            color: white;
            padding: 12px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
            transition: 0.3s;
            width: 100%;
        }

        .submit-button:hover {
            background: linear-gradient(45deg, #388e3c, #1b5e20);
        }

        /* Styling for the video and table section */
        video {
            width: 100%;
            max-width: 640px;
            margin: 20px 0;
        }

        table {
            width: 100%;
            margin: 20px 0;
            border-collapse: collapse;
            text-align: center;
        }

        table th, table td {
            padding: 10px;
            border: 1px solid #ddd;
        }

        table th {
            background-color: #1e88e5;
            color: white;
        }

        .table-button {
            background: #1e88e5;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .table-button:hover {
            background: #1565c0;
        }

        /* Image styling */
        img {
            margin-top: 20px;
            border-radius: 10px;
        }
    </style>
</head>

            <label for="room">Select Room Type:</label>
            <select id="room" name="room" required>
                <option value="Single Room">Single Room - $50/night</option>
                <option value="Double Room">Double Room - $80/night</option>
                <option value="Suite">Suite - $120/night</option>
            </select>

            <textarea id="recommendations" name="recommendations" rows="3" placeholder="Any special requests or preferences?"></textarea>
